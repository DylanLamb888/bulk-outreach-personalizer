  <text x="783" y="150" fill="#1a293b" font-family="Georgia,serif" font-size="31">The whole sequence.</text>
  <text x="783" y="180" fill="#647080" font-family="Arial,Helvetica,sans-serif" font-size="14">From the first line to the final follow-up.</text>
