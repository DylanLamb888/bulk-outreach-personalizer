<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Bulk Enrich — Good outreach. Built on context.</title>
  <desc id="desc">A navy and ivory editorial banner. One campaign brief becomes company research, approved copy and a complete delivery.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a8b4c5" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="16" fill="#142133"/>
  <rect x="685" width="515" height="460" rx="16" fill="url(#grid)"/>
  <path d="M48 58h10v20H48zm15-8h10v28H63zm15-8h10v36H78z" fill="#d3b578"/>
  <text x="105" y="68" fill="#e8d7b3" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="4">BULK ENRICH</text>
  <text x="48" y="180" fill="#f6f2ea" font-family="Georgia,serif" font-size="76" letter-spacing="-2">Good outreach.</text>
  <text x="48" y="265" fill="#f6f2ea" font-family="Georgia,serif" font-size="76" letter-spacing="-2">Built on context.</text>
  <text x="52" y="319" fill="#bbc5d1" font-family="Arial,Helvetica,sans-serif" font-size="21">One brief. Researched companies. Complete sequences.</text>
  <path d="M52 373h629" stroke="#384353"/>
  <text x="52" y="410" fill="#d3b578" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2">RESEARCH ONCE</text>
  <circle cx="225" cy="406" r="2" fill="#798491"/>
  <text x="244" y="410" fill="#d3b578" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2">REFINE THE COPY</text>
  <circle cx="425" cy="406" r="2" fill="#798491"/>
  <text x="444" y="410" fill="#d3b578" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2">DELIVER WITH EVIDENCE</text>
  <rect x="775" y="71" width="351" height="318" rx="12" fill="#0b1420" opacity=".45" transform="rotate(4 950 230)"/>
  <rect x="759" y="56" width="351" height="326" rx="12" fill="#f5f1e8"/>
